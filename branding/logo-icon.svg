<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ThixFred, full detail (48 px and up): the launcher bar with its prompt and cursor on a violet tile, the results below it. -->
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9A7DFF"/>
      <stop offset="1" stop-color="#4B26E3"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEAFF"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#21107A" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <!-- the results -->
  <rect x="214" y="560" width="596" height="250" rx="54" fill="#FFFFFF" opacity="0.22"/>
  <rect x="274" y="622" width="300" height="34" rx="17" fill="#FFFFFF" opacity="0.85"/>
  <rect x="274" y="704" width="200" height="34" rx="17" fill="#FFFFFF" opacity="0.55"/>
  <!-- the bar -->
  <rect x="150" y="270" width="724" height="244" rx="76" fill="url(#bar)" filter="url(#lift)"/>
  <path d="M262 334 L362 392 L262 450" fill="none" stroke="#5B33F0" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="418" y="368" width="236" height="48" rx="24" fill="#5B33F0" opacity="0.3"/>
  <rect x="694" y="326" width="34" height="132" rx="17" fill="#5B33F0"/>
</svg>
